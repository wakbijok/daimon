# cargo-deny configuration for dAImon.
#
# Primary purpose: enforce D21 (worker dependency restriction). The internal
# crates `daimon-vault`, `daimon-inventory`, and `daimon-transport` may ONLY
# appear as dependencies of `daimon-broker`. Any worker crate or
# `daimon-app` that tries to depend on them directly fails this gate.
#
# `daimon-audit` is NOT under this gate — daimon-app reads it via the broker
# admin proxy, and the events themselves carry no secrets by design (D23).
#
# Install:    cargo install --locked cargo-deny
# Run:        cargo deny check
# In CI:      cargo deny check bans  (just the D21 invariant)
#             cargo deny check       (all sections: bans + licenses + advisories + sources)

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.93

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# D21 ENFORCEMENT — the load-bearing rule.
#
# These three crates carry credentials, target metadata, and raw transport
# I/O. Workers and the I/O adapter MUST go through `daimon-broker` instead.
# If a new crate genuinely needs direct access, add it to `wrappers` and
# document why in the spec.
deny = [
    # Production crates that may wrap the internal trio:
    # - daimon-broker: the architectural single integration point (D19/D21)
    # - daimon-cli:    operator tooling that wires the production stack
    #                  (vault SqliteVaultClient + transport SshTransport
    #                  configuration). Treated as part of broker scope.
    # Worker crates (`daimon-tool-*`) and `daimon-app` are NOT in this list.
    { crate = "daimon-vault",     wrappers = ["daimon-broker", "daimon-cli"] },
    { crate = "daimon-inventory", wrappers = ["daimon-broker", "daimon-cli"] },
    { crate = "daimon-transport", wrappers = ["daimon-broker", "daimon-cli"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
