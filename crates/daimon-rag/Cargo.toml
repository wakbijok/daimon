[package]
name = "daimon-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RAG pipeline for daimon — chunking, local embedding via fastembed, hybrid retrieval over Qdrant (dense + sparse), cross-encoder reranking, token-budget context packing."

[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-memory = { path = "../daimon-memory" }
fastembed = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
