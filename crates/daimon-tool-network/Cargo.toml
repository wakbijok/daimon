[package]
name = "daimon-tool-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Network worker agent for daimon. Phase 4 reads (RouterOS CLI via SSH broker). Writes land in Phase 5 (Guard-gated). Worker crate — does NOT depend on vault/inventory/transport directly (D21)."

[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-broker = { path = "../daimon-broker" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Phase 8 dev-only deps for the locked-vertical e2e test. The D21
# invariant (workers cannot import vault/inventory/transport) only
# applies to production dependencies — tests are exempt because they're
# never linked into the worker binary.
daimon-inventory = { path = "../daimon-inventory", features = ["for-broker"] }
daimon-transport = { path = "../daimon-transport", features = ["for-broker"] }
daimon-vault = { path = "../daimon-vault", features = ["for-broker"] }
