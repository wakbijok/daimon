[package]
name = "daimon-driver-firewall-routeros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference Driver: RouterOS firewall/network over SSH via the broker. Implements the daimon-driver Driver trait + an Agent bus adapter. Worker crate — does NOT depend on vault/inventory/transport directly (D21); reaches infrastructure only through daimon-broker."

# D21 boundary: this crate MUST NOT depend on daimon-vault, daimon-inventory,
# or daimon-transport directly. It reaches infrastructure exclusively through
# daimon-broker (which re-exports Op / OpResult / TargetRef / HttpMethod).
[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-broker = { path = "../daimon-broker" }
daimon-driver = { path = "../daimon-driver" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Dev-only deps for the locked-vertical e2e test. The D21 invariant (workers
# cannot import vault/inventory/transport) only applies to production
# dependencies — tests are exempt because they're never linked into the worker
# binary.
daimon-inventory = { path = "../daimon-inventory", features = ["for-broker"] }
daimon-transport = { path = "../daimon-transport", features = ["for-broker"] }
daimon-vault = { path = "../daimon-vault", features = ["for-broker"] }
