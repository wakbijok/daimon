[package]
name = "daimon-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Plan orchestrator for daimon — persists Plan DAGs, executes steps in topological order via broker, replans on failure (saga rollback ships in Phase 6.1)."

[dependencies]
daimon-db = { path = "../daimon-db" }
daimon-llm = { path = "../daimon-llm" }
daimon-graph = { path = "../daimon-graph" }
# P2 commit 6: the orchestrator dispatches steps over the bus (NOT the broker
# directly), so it holds a `daimon_runtime::Dispatcher` built from the same
# bus+registry as the app's Harness. It depends on daimon-core (AgentId) +
# daimon-runtime + semver (VersionReq) — NOT on daimon-app (D21).
daimon-core = { path = "../daimon-core" }
daimon-runtime = { path = "../daimon-runtime" }
# P3 commit 10: on a terminal plan state the orchestrator captures a typed
# record (Succeeded → Decision, Failed → Incident) into long-term memory. This
# is the AID, written AFTER the status UPDATE + audit (the TRUTH); every capture
# is fail-soft. Optional Arc<dyn MemoryService>, wired from main.rs.
daimon-memory = { path = "../daimon-memory" }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# The remediation-vertical e2e test (tests/remediation_vertical.rs) assembles the
# REAL loop: broker + guard + inventory + vault + stub transport + the RouterOS
# driver on the bus. The internal broker-only crates (inventory/vault/transport)
# must enable `for-broker` or their public surface is empty (D21 gate). Mirrors
# the way daimon-broker itself depends on them.
daimon-broker = { path = "../daimon-broker" }
daimon-guard = { path = "../daimon-guard" }
daimon-audit = { path = "../daimon-audit" }
daimon-driver-firewall-routeros = { path = "../daimon-driver-firewall-routeros" }
daimon-inventory = { path = "../daimon-inventory", features = ["for-broker"] }
daimon-transport = { path = "../daimon-transport", features = ["for-broker"] }
daimon-vault = { path = "../daimon-vault", features = ["for-broker"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
