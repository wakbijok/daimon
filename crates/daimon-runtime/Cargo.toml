[package]
name = "daimon-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent lifecycle and message routing — AgentBus trait, InProcBus (default) and NatsBus (Phase 8, feature-gated), Supervisor, CapabilityRegistry"

[features]
default = []
nats = ["dep:async-nats"]

[dependencies]
daimon-core = { path = "../daimon-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
async-nats = { version = "0.42", optional = true }
