[package]
name = "daimon-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-tree credential vault — PostgreSQL + per-row XChaCha20-Poly1305, master DEK wrapped by KMS at rest (D22 + D4 update Phase 2c). INTERNAL — only daimon-broker enables `for-broker` (D21)."

[features]
default = []
# D21: Worker crates depending on daimon-vault without `for-broker` see no
# pub items. Only daimon-broker enables this feature. Belt-and-suspenders
# layer on top of the dep-graph + cargo deny enforcement.
for-broker = []

[dependencies]
daimon-core = { path = "../daimon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
url = "2"
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
# Phase 2c D3b: Postgres-backed vault. SQLite removed.
daimon-db = { path = "../daimon-db" }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
lru = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
