[package]
name = "daimon-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vaultwarden-backed credential resolution with sealed-box session persistence (D3, D4). INTERNAL — only daimon-broker enables `for-broker` (D21)."

[features]
default = []
# D21: Worker crates depending on daimon-vault without `for-broker` see no
# pub items. Only daimon-broker enables this feature. Belt-and-suspenders
# layer on top of the dep-graph + cargo deny enforcement.
for-broker = []

[dependencies]
daimon-core = { path = "../daimon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
url = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
