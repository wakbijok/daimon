[package]
name = "daimon-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared transport library — SSH (russh), REST (reqwest), SNMP (csnmp). gRPC slot defined but unimplemented. INTERNAL — only daimon-broker enables `for-broker` (D21)."

[features]
default = []
# D21: same belt-and-suspenders gate as daimon-vault. Without `for-broker`,
# the public surface is empty.
for-broker = ["daimon-vault/for-broker"]

[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-vault = { path = "../daimon-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bytes = "1"
russh = "0.45"
russh-keys = "0.45"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
csnmp = "0.6"

[dev-dependencies]
tempfile = "3"
# Async HTTP mock server for the RestTransport integration test.
wiremock = "0.6"
