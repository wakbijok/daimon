[package]
name = "daimon-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Append-only audit event log (D23). Postgres-backed with DB-level UPDATE/DELETE blocking + per-tenant hash chain (Phase 2c). Broker writes; daimon-app reads via admin UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
daimon-db = { path = "../daimon-db" }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
