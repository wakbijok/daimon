[package]
name = "daimon-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Memory tier seam for daimon agents. Long-term memory is a dmem sidecar (dm-lite `dmem serve`) reached over bearer-authenticated HTTP behind the MemoryService trait."

[dependencies]
daimon-core = { path = "../daimon-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
