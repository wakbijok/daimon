[package]
name = "daimon-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Guard for daimon — KILL switch (D13), policy DSL, approval inbox. Broker consults guard before dispatching writes."

[dependencies]
daimon-db = { path = "../daimon-db" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "fs", "signal", "time"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
