[package]
name = "daimon-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PUBLIC action surface for daimon agents (D19). Workers call broker.execute(ExecRequest) → OpResult; credentials never leave the broker boundary."

[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-inventory = { path = "../daimon-inventory", features = ["for-broker"] }
daimon-vault = { path = "../daimon-vault", features = ["for-broker"] }
daimon-transport = { path = "../daimon-transport", features = ["for-broker"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
