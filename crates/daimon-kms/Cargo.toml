[package]
name = "daimon-kms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "KMS adapter for the vault master DEK (Phase 2c D4). HashiCorp Vault Transit + AWS KMS + PKCS#11 + LocalFile."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# HashiCorp Vault Transit impl: HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
