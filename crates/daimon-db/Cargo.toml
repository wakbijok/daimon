[package]
name = "daimon-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 2c relational tier — PostgreSQL schema migrations + connection pool factory. tokio-postgres + refinery."

[[bin]]
name = "daimon-migrate"
path = "src/bin/daimon_migrate.rs"

[dependencies]
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
# refinery's `tokio-postgres` feature hardwires postgres-native-tls →
# native-tls → openssl-sys (there is no rustls path in refinery 0.9), so the
# musl-static production build needs a static OpenSSL. `default-features = false`
# drops refinery's unused `toml` default; the vendored OpenSSL for the musl
# target is provided in the target section below.
refinery = { version = "0.9", default-features = false, features = ["tokio-postgres"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# The musl-static build has no system OpenSSL to link; refinery pulls
# openssl-sys transitively (see above). Build OpenSSL VENDORED (compiled from
# source, statically linked) for the musl target ONLY — the host build is
# untouched, so `just check`/tests keep using the system libs and stay fast.
[target.x86_64-unknown-linux-musl.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
