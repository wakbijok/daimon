[package]
name = "daimon-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Managed asset registry — target://X → host + transport + credential ref (D20). INTERNAL — only daimon-broker enables `for-broker` (D21)."

[features]
default = []
for-broker = []

[dependencies]
daimon-core = { path = "../daimon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
