[package]
name = "daimon-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Managed asset registry — target://X → host + transport + credential ref (D20). INTERNAL — only daimon-broker enables `for-broker` (D21)."

[features]
default = []
for-broker = []

[dependencies]
daimon-core = { path = "../daimon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
daimon-db = { path = "../daimon-db" }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
