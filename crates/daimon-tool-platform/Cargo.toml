[package]
name = "daimon-tool-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform worker tier — wraps platform-specific clients (PVE today; future: K8s, OpenStack) behind a single capability-based trait. Phase 7 D1."

[dependencies]
daimon-core = { path = "../daimon-core" }
daimon-pve = { path = "../daimon-pve" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
