[package]
name = "daimon-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis tier (#3) for daimon — hot working memory, plan-in-flight handoff, kill-switch signal channel. Native Redis binary in dev; Cluster/Sentinel in prod."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
deadpool-redis = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
