[package]
name = "daimon-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Observer tier (#4) — Prometheus pull, named-query library, anomaly detection, time-series persistence to observer.metrics. Phase 7 D4."

[dependencies]
daimon-db = { path = "../daimon-db" }
# P3 commit 7: the observer emits an `AnomalyDetected` envelope onto the agent
# bus so the TriageAgent can pick it up. It needs `daimon-core` for
# `AgentEnvelope`/`Recipient`/`BusHandle`/`AgentId` + `semver` for the
# capability version requirement. It MUST NOT depend on `daimon-runtime` (D21):
# the observer only holds an `Arc<dyn BusHandle>` (the abstract slice), never
# the concrete `InProcBus`/`Supervisor`.
daimon-core = { path = "../daimon-core" }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
