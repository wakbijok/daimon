[package]
name = "daimon-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graph tier (#5) — NornicDB Bolt client for blast-radius queries, plan-DAG persistence, capability + target + credential lineage. Phase 8 lock per MASTERPLAN §3.6."

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
neo4rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
