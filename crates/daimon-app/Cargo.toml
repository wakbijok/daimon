[package]
name = "daimon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "daimon web application — Leptos full-stack"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlDocument", "HtmlElement", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType", "Storage", "MediaQueryList", "Navigator", "Clipboard", "KeyboardEvent", "HtmlInputElement", "File", "FileList", "FileReader", "Blob", "ProgressEvent", "EventTarget", "Crypto"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }

# Server-only dependencies
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
leptos_axum = { version = "0.8", optional = true }
# Phase 2c D3b: rusqlite removed, daimon-db wraps tokio-postgres + deadpool.
daimon-db = { path = "../daimon-db", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
jsonwebtoken = { version = "9", optional = true }
bcrypt = { version = "0.17", optional = true }
rand = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
# P3 commit 11 (AC-P3-06) — install ONE tracing subscriber at boot so the
# broker/guard/transport/observer #[instrument]/info!/warn! spans (dropped today
# for lack of any subscriber) surface. json+env-filter, ssr-only. No heavy
# metrics dep: /metrics is hand-rolled (see observability.rs).
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# Phase 2b #19: in-process broker stack. daimon-app is a permitted wrapper
# per `deny.toml` (same rationale as daimon-cli). `for-broker` opens the
# internal API surface on the gated three crates.
daimon-broker = { path = "../daimon-broker", optional = true }
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }

# Phase 3 #9 / P3: memory tier for /admin/memory admin UI + chat pre-turn
# recall. Long-term memory is now the dmem sidecar behind MemoryService
# (daimon-rag + Qdrant retired in P3).
daimon-memory = { path = "../daimon-memory", optional = true }

# Phase 4: LLM + first worker agent for /chat.
daimon-llm = { path = "../daimon-llm", optional = true }
daimon-core = { path = "../daimon-core", optional = true }
# P2: the multi-agent harness (bus/registry/supervisor) + the reference driver.
daimon-runtime = { path = "../daimon-runtime", optional = true }
daimon-driver-firewall-routeros = { path = "../daimon-driver-firewall-routeros", optional = true }
# P2 commit 9: the generic declarative ConnectorDriver (second driver, REST).
daimon-driver = { path = "../daimon-driver", optional = true }
semver = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
thiserror = { version = "1", optional = true }
daimon-redis = { path = "../daimon-redis", optional = true }
daimon-orchestrator = { path = "../daimon-orchestrator", optional = true }
daimon-observer = { path = "../daimon-observer", optional = true }
# P3 commits 8+9: the supervised TriageAgent (detect→triage hop). Consumes the
# observer's AnomalyDetected envelope (ByCapability harness.triage.anomaly),
# opens a persisted-not-run triage plan. ssr-only (app-side coordinator).
daimon-triage = { path = "../daimon-triage", optional = true }
daimon-graph = { path = "../daimon-graph", optional = true }
daimon-guard = { path = "../daimon-guard", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
# P4: messaging gateways. The chat loop's ReplySink seam lives here (the browser
# WsSink implements it); the Telegram (webhook) + Matrix (/sync poller) adapters
# are behind this crate's own features. ssr-only — adapters pull tokio/reqwest.
daimon-gateway = { path = "../daimon-gateway", features = ["telegram", "matrix"], optional = true }
# P5-5: skills are declarative plan templates parsed from deploy/skills/*.toml.
toml = { version = "0.8", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:gloo-timers",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_router/ssr",
    "dep:daimon-db",
    "dep:tokio-postgres",
    "dep:jsonwebtoken",
    "dep:bcrypt",
    "dep:rand",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:daimon-broker",
    "dep:anyhow",
    "dep:chrono",
    "dep:daimon-memory",
    "dep:daimon-llm",
    "dep:daimon-core",
    "dep:daimon-runtime",
    "dep:daimon-driver-firewall-routeros",
    "dep:daimon-driver",
    "dep:semver",
    "dep:async-trait",
    "dep:thiserror",
    "dep:daimon-redis",
    "dep:daimon-orchestrator",
    "dep:daimon-observer",
    "dep:daimon-triage",
    "dep:daimon-graph",
    "dep:daimon-guard",
    "dep:reqwest",
    "dep:futures-util",
    "dep:daimon-gateway",
    "dep:toml",
]
